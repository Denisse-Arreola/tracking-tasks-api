services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html

    ports:
      - "8000:8000"
      - "5173:5173"

    depends_on:
      - mysql

    stdin_open: true
    tty: true


  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: tracking_tasks
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data: